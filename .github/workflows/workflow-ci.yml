name: CI/CD All Projects

on:
  workflow_dispatch:   # Cho phép chạy thủ công từ tab Actions
  push:                # Chạy khi có commit vào main
    branches: [ "main" , "Fong" , "bao" ]
  pull_request:        # Hoặc khi có PR vào main
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build Backend
        working-directory: ./BE  
        run: mvn clean install -DskipTests

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./ADMIN/yarn.lock

      - name: Build Admin
        working-directory: ./ADMIN
        run: |
          yarn install --frozen-lockfile
          yarn build

  user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./USER/yarn.lock

      - name: Build User
        working-directory: ./USER
        run: |
          yarn install --frozen-lockfile
          yarn build

