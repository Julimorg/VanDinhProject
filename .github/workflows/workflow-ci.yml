name: CI/CD All Projects

on:
  workflow_dispatch:
  push:
    branches: [ "main", "Fong", "bao" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        working-directory: ./BE
        run: chmod +x gradlew

      - name: Build all modules (skip tests)
        working-directory: ./BE
        run: ./gradlew :app:build -x test --parallel --configuration-cache

  docker-build-push:
    runs-on: ubuntu-latest
    needs: backend
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          push: true
          tags: |
            jianfong/van-dinh-be:latest
            jianfong/van-dinh-be:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to self-hosted server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull jianfong/van-dinh-be:latest
            cd /home/jianfong/app
            docker compose up -d
            docker image prune -f
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./ADMIN/yarn.lock

      - name: Build Admin
        working-directory: ./ADMIN
        run: |
          yarn install --frozen-lockfile
          yarn build

  user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./USER/yarn.lock

      - name: Build User
        working-directory: ./USER
        run: |
          yarn install --frozen-lockfile
          yarn build