<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Realtime Notification</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f4f4;
      }
      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      input,
      button {
        margin: 8px 0;
        padding: 10px;
        width: 100%;
        font-size: 16px;
      }
      button {
        cursor: pointer;
      }
      #status {
        padding: 12px;
        margin: 15px 0;
        border-radius: 6px;
        font-weight: bold;
      }
      .success {
        background: #d4edda;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
      }
      .info {
        background: #d1ecf1;
        color: #0c5460;
      }
      #logs {
        background: #f8f9fa;
        padding: 10px;
        height: 160px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 13px;
        border: 1px solid #ddd;
        margin-top: 10px;
      }
      #notifications {
        border: 1px solid #ccc;
        padding: 10px;
        min-height: 300px;
        background: #f9f9f9;
        margin-top: 15px;
      }
      .noti-item {
        padding: 12px;
        border-bottom: 1px solid #eee;
        position: relative;
        border-radius: 4px;
        margin-bottom: 8px;
      }
      .realtime {
        border-left: 5px solid #28a745;
        background: #e8f5e9;
      }
      .from-db {
        border-left: 5px solid #007bff;
        background: #e7f0ff;
      }
      .label {
        font-size: 11px;
        font-weight: bold;
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.15);
        padding: 3px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Realtime Notification Test (STOMP + WebSocket)</h2>

      <div id="loginSection">
        <h3>Đăng nhập</h3>
        <input
          type="text"
          id="username"
          placeholder="Username"
          value="fonguser"
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          value="123456"
        />
        <button onclick="login()">Đăng nhập</button>
      </div>

      <div id="userInfo" style="display: none; margin-top: 20px">
        <p>Đã đăng nhập - User ID: <strong id="displayUserId"></strong></p>
        <button onclick="fetchMyNotifications()">
          Refresh thông báo từ DB
        </button>
        <button
          onclick="disconnect()"
          id="disconnectBtn"
          style="display: none; margin-left: 10px"
        >
          Ngắt WebSocket
        </button>
        <button
          onclick="logout()"
          style="margin-left: 10px; background: #dc3545; color: white"
        >
          Đăng xuất
        </button>
      </div>

      <div id="status" class="info">Chưa đăng nhập</div>

      <h3>Debug Log</h3>
      <div id="logs"></div>

      <h3>Danh sách thông báo</h3>
      <div id="notifications"></div>
    </div>

    <script>
      let stompClient = null;
      let accessToken = localStorage.getItem("accessToken");
      let currentUserId = localStorage.getItem("userId");

      const apiBaseUrl = "http://localhost:8080";
      const loginEndpoint = "/api/v1/auth/log-in"; // Đúng endpoint login
      const myNotiEndpoint = "/api/v1/notification/my-notifications";
      const wsEndpoint = "/ws";

      // Log cả console và giao diện
      function addLog(msg, type = "info") {
        console.log(msg);
        const logDiv = document.getElementById("logs");
        const entry = document.createElement("div");
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        entry.style.color =
          type === "error" ? "red" : type === "success" ? "green" : "blue";
        logDiv.prepend(entry);
        if (logDiv.children.length > 100) logDiv.removeChild(logDiv.lastChild);
      }

      function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) return alert("Vui lòng nhập đầy đủ");

        addLog("Đang gửi request đăng nhập...");
        fetch(apiBaseUrl + loginEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.data && data.data.accessToken && data.data.id) {
              accessToken = data.data.accessToken;
              currentUserId = data.data.id; // Lấy đúng UUID từ response

              localStorage.setItem("accessToken", accessToken);
              localStorage.setItem("userId", currentUserId);

              addLog(
                `Đăng nhập thành công! UserId = ${currentUserId}`,
                "success"
              );
              showUserInterface();
              connectWebSocket();
              fetchMyNotifications();
            } else {
              throw new Error(
                "Response không hợp lệ hoặc thiếu id/accessToken"
              );
            }
          })
          .catch((err) => {
            addLog("Đăng nhập thất bại: " + err.message, "error");
          });
      }

      function showUserInterface() {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("userInfo").style.display = "block";
        document.getElementById("displayUserId").textContent = currentUserId;
        document.getElementById("status").innerHTML =
          '<span class="success">Đã đăng nhập - Đang kết nối WebSocket...</span>';
      }

      function connectWebSocket() {
        addLog("Đang kết nối WebSocket tới " + apiBaseUrl + wsEndpoint);
        const socket = new SockJS(apiBaseUrl + wsEndpoint);
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        const headers = { Authorization: "Bearer " + accessToken };

        stompClient.connect(
          headers,
          (frame) => {
            addLog("WebSocket CONNECT thành công!", "success");
            document.getElementById("status").innerHTML =
              '<span class="success">WebSocket đã kết nối - Đang lắng nghe realtime</span>';
            document.getElementById("disconnectBtn").style.display =
              "inline-block";

            try {
              console.log("Đang subscribe tới /user/queue/notifications"); // Log rõ ràng hơn

              stompClient.subscribe(
                "/user/queue/notifications", // ← FIX: Generic, không hardcode userId
    
                (message) => {
                  console.log(
                    "Đã nhận message từ destination:",
                    message.headers.destination
                  );
                  console.log("WebSocket URL:", apiBaseUrl + wsEndpoint);
                  addLog(">>> NHẬN ĐƯỢC NOTIFICATION REALTIME <<<", "success");
                  console.log("Realtime message:", message);
                  const noti = JSON.parse(message.body);
                  addNotification(noti, true);
                }
              );
              addLog(
                "Subscribe thành công tới /user/queue/notifications",
                "success"
              ); // Thêm log confirm subscribe
            } catch (e) {
              console.log("Lỗi subscribe:", e);
              addLog("Lỗi subscribe: " + e, "error");
            }
          },
          (error) => {
            addLog("Lỗi WebSocket: " + JSON.stringify(error), "error");
            document.getElementById("status").innerHTML =
              '<span class="error">WebSocket lỗi: ' + error + "</span>";
          }
        );
      }

      function fetchMyNotifications() {
        if (!currentUserId || !accessToken) return;

        addLog("Đang tải thông báo từ DB...");
        fetch(`${apiBaseUrl}${myNotiEndpoint}/${currentUserId}`, {
          headers: { Authorization: "Bearer " + accessToken },
        })
          .then((res) => res.json())
          .then((list) => {
            document.getElementById("notifications").innerHTML = "";
            addLog(`Tải thành công ${list.length} thông báo từ DB`);
            list.forEach((noti) => addNotification(noti, false));
          })
          .catch((err) => {
            addLog("Lỗi tải thông báo DB: " + err, "error");
          });
      }

      function addNotification(noti, isRealtime = false) {
        const div = document.createElement("div");
        div.className = `noti-item ${isRealtime ? "realtime" : "from-db"}`;
        div.innerHTML = `
                <strong>${noti.title || "No title"}</strong><br>
                ${noti.message || "No message"}<br>
                <small>Type: ${noti.type || "N/A"} | ${new Date(
          noti.createdAt
        ).toLocaleString()}</small>
                <span class="label">${isRealtime ? "REALTIME" : "TỪ DB"}</span>
            `;
        document.getElementById("notifications").prepend(div);
      }

      function disconnect() {
        if (stompClient) {
          stompClient.disconnect(() => {
            addLog("Đã ngắt kết nối WebSocket");
            document.getElementById("disconnectBtn").style.display = "none";
            document.getElementById("status").innerHTML =
              '<span class="info">WebSocket đã ngắt</span>';
          });
        }
      }

      function logout() {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("userId");
        accessToken = null;
        currentUserId = null;
        disconnect();
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("userInfo").style.display = "none";
        document.getElementById("notifications").innerHTML = "";
        document.getElementById("logs").innerHTML = "";
        document.getElementById("status").innerHTML =
          '<span class="info">Đã đăng xuất</span>';
        addLog("Đã đăng xuất");
      }

      // Tự động khôi phục nếu đã login trước
      if (accessToken && currentUserId) {
        addLog("Phát hiện phiên cũ - Tự động khôi phục");
        showUserInterface();
        connectWebSocket();
        fetchMyNotifications();
      }
    </script>
  </body>
</html>
