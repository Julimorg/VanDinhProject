spring.application.name=management-api
#debug=true
server.port=${PORT:8080}
#Config auto update Spring
spring.jpa.hibernate.ddl-auto=update


#Config Docker
#spring.docker.compose.enabled=true


#Config DB Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql:true 
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver


#Config SwaggerUID
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


#JWT
expiry.date=${EXPIRY_DATE}
refreshable.duration=${REFRESHABLE_DURATION}
signer.key=${SIGNER_KEY}

#Cloudinary
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}


#Config File Size
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB


#Config Email Key
mail.provider=${MAIL_PROVIDER}
mail.from-email=${MAIL_FROM_EMAIL}
mail.from-name=${MAIL_FROM_NAME}
mail.sendgrid.api-key=${SEND_GRID_API_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_FROM_EMAIL}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
#logging.level.org.thymeleaf=DEBUG


#Config Scheduler and Async
spring.task.scheduling.pool.size=10
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

#Config Flyway
spring.flyway.enabled=false
#spring.flyway.locations=classpath:db/migration
#spring.flyway.baseline-on-migrate=true


#Config VnPay
vnp.urlDevTest=${VNP_URL_DEV_TEST}
vnp.tmncode=${VNP_TMNCODE}
vnp.secretkey=${VNP_SECRETKEY}
vnp.returnUrl=${VNP_RETURN_URL}
vnp.apiUrl=${VNP_API_URL}
vnp.version=${VNP_VERSION}
vnp.command=${VNP_COMMAND}
#vnp.returnUrl=http://localhost:8080/vnpay-payment

#Config WebSocket
logging.level.org.springframework.messaging.simp.user=TRACE
logging.level.org.springframework.messaging.simp.stomp=TRACE
logging.level.org.springframework.web.socket.messaging=TRACE