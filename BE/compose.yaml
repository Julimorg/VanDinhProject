services:
  app:
    image: jianfong/van-dinh-be:latest
    container_name: spring-app
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true