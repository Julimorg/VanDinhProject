/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'java'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2')
    }

    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    api libs.org.springframework.boot.spring.boot.starter.data.jpa
    api libs.org.springframework.boot.spring.boot.starter.mail
    api libs.org.springframework.boot.spring.boot.starter.thymeleaf
    api libs.org.springframework.boot.spring.boot.starter.jdbc
    api libs.org.flywaydb.flyway.core
    api libs.org.springframework.boot.spring.boot.starter.validation
    api libs.org.springframework.boot.spring.boot.starter.websocket
    api libs.org.springframework.modulith.spring.modulith.starter.core
    api libs.org.springframework.modulith.spring.modulith.starter.jpa
    api libs.com.sendgrid.sendgrid.java
    api libs.com.opencsv.opencsv
    api libs.io.github.cdimascio.dotenv.java
    api libs.me.paulschwarz.spring.dotenv
    api libs.org.springframework.boot.spring.boot.configuration.processor
    api libs.org.projectlombok.lombok
    api libs.org.mapstruct.mapstruct
    api libs.commons.io.commons.io
    api libs.com.cloudinary.cloudinary.http45
    api libs.org.springframework.security.spring.security.crypto
    api libs.org.springdoc.springdoc.openapi.starter.webmvc.ui
    api libs.org.apache.poi.poi
    api libs.org.apache.poi.poi.ooxml
    api libs.com.nimbusds.nimbus.jose.jwt
    api libs.org.springframework.boot.spring.boot.starter.oauth2.resource.server
    api libs.com.google.zxing.core
    api libs.com.google.zxing.javase
    api libs.org.springframework.boot.spring.boot.starter.data.elasticsearch
    api libs.co.elastic.clients.elasticsearch.java
    runtimeOnly libs.org.springframework.boot.spring.boot.devtools
    runtimeOnly libs.org.postgresql.postgresql
    runtimeOnly libs.com.mysql.mysql.connector.j
    testImplementation libs.org.springframework.boot.spring.boot.starter.test
    testImplementation libs.org.springframework.modulith.spring.modulith.starter.test
    testImplementation libs.org.springframework.restdocs.spring.restdocs.mockmvc
    testImplementation libs.org.springframework.security.spring.security.test
    testImplementation libs.com.h2database.h2
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'management-api'
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
